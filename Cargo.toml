[workspace]
members = [
    "crates/fast-http",
    "crates/fast-extract",
    "crates/fast-macros",
    "crates/fast-core",
    "examples/demo_api",
]
resolver = "2"

[workspace.dependencies]
httparse = "1"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["full"] }

[package]
name = "fast-rs"
version = "0.1.0"
edition = "2021"
description = "A compile-time, FastAPI-inspired async web micro-framework built in Rust."
license = "MIT"
repository = "[https://github.com/Furina-star/fast-rs](https://github.com/Furina-star/fast-rs)"

[dependencies]
fast-http = { path = "crates/fast-http" }
fast-extract = { path = "crates/fast-extract" }
fast-macros = { path = "crates/fast-macros" }
fast-core = { path = "crates/fast-core" }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }